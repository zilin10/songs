<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>米牙 - 试探性分手 (Lyrics & Pinyin)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <span class="badge">Romanized / Pinyin Lyrics</span>
      <h1>试探性分手</h1>
      <p class="artist">米牙 (Miya)</p>
    </div>
  </header>

  <main class="container">
    <div class="lyrics-card">
      <div class="section-title">[ Chorus / 副歌 ]</div>

      <!-- Each lyric pair displays the original Chinese and Pinyin side-by-side -->
      <div class="line-pair">
        <span class="original">我说分手</span>
        <span class="pinyin">Wǒ shuō fēnshǒu</span>
      </div>

      <div class="line-pair">
        <span class="original">是想你挽留</span>
        <span class="pinyin">Shì xiǎng nǐ wǎnliú</span>
      </div>

      <div class="line-pair">
        <span class="original">你怎么真的点了头</span>
        <span class="pinyin">Nǐ zěnme zhēnde diǎnle tóu</span>
      </div>

      <div class="line-pair">
        <span class="original">我把狠话说够</span>
        <span class="pinyin">Wǒ bǎ hěn huà shuō gòu</span>
      </div>

      <!-- Add remaining lines following the same structure -->
    </div>
  </main>

  <footer>
    <p>Lyrics © Original Rights Holders & Artists.</p>
  </footer>

</body>
</html>
